<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0F1B17">
<title>O’ge — Focus & Wealth</title>
<script>
/* Apply saved theme before first paint (dark by default) */
(function(){var t='dark';try{var s=localStorage.getItem('oge.theme');if(s==='light'||s==='dark')t=s}catch(e){}document.documentElement.setAttribute('data-theme',t)})();
</script>
<style>
:root{
  /* Single place to swap in the exact SafeBet green once its brand file is available */
  --brand:#1F7F5C;            /* fills: buttons, progress, active states (white text passes AA) */
  --brand-text:#5CCB9E;       /* green used as text/icons on dark surfaces */
  --bg:#12201B; --card:#0F1B17; --line:#263C34; --field:#0B1511;
  --text:#F3F7F5; --muted:#8AA89B;
  --soft:rgba(92,203,158,.12); --edge:rgba(92,203,158,.35); --danger:#E57373;
  --r:20px; --r-s:12px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
}
[data-theme="light"]{
  --brand:#1F7F5C; --brand-text:#17674A;
  --bg:#F6F3EC; --card:#FFFFFF; --line:#E3DED2; --field:#FBF9F4;
  --text:#14201B; --muted:#5F7269;
  --soft:rgba(31,127,92,.09); --edge:rgba(31,127,92,.35); --danger:#B3422F;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;max-width:720px;margin:0 auto;background:var(--bg)}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 20px 24px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.view{animation:in .25s ease-out;display:flex;flex-direction:column;gap:14px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.15}
h2{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--brand-text);font-weight:800}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.row.done .tt{text-decoration:line-through;color:var(--muted)}.row.drop{opacity:.55}
.info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.tm{font-size:12px;font-weight:800;color:var(--brand-text);letter-spacing:.5px}
.tt{font-size:15px;font-weight:600;letter-spacing:-.2px;overflow-wrap:anywhere}
.tg{font-size:12px;color:var(--muted)}
.amt{font-size:32px;font-weight:800;color:var(--brand-text);letter-spacing:-1px}
.bar{height:8px;border-radius:4px;background:var(--field);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .4s}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--edge);color:var(--brand-text);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;align-self:flex-start}
.btn{min-height:48px;padding:0 20px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--edge);background:var(--soft);color:var(--brand-text);transition:transform .1s,background .2s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--text)}
.btn.bad{color:var(--danger);border-color:var(--line);background:transparent}
.btn.full{width:100%}
.ib{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--brand-text);border:1px solid var(--line);background:var(--card)}
.ib.plain{border-color:transparent;background:transparent;color:var(--muted)}
.chk{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.chk b{width:26px;height:26px;border-radius:50%;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;color:#fff}
.chk b svg{opacity:0}.done .chk b{background:var(--brand);border-color:var(--brand)}.done .chk b svg{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;transition:all .15s;text-align:left}
.chip.on{background:var(--soft);border-color:var(--brand);color:var(--brand-text)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted);flex:1;min-width:120px}
.fld{min-height:46px;width:100%;padding:10px 14px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--field);font-size:16px;font-weight:500;outline:none;color:var(--text)}
.fld:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
textarea.fld{min-height:80px;resize:vertical}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 20px 4px}
.mark{font-weight:800;letter-spacing:-.5px;font-size:18px}.mark span{color:var(--brand-text)}
.nav{display:flex;justify-content:space-around;margin:0 16px calc(12px + env(safe-area-inset-bottom));padding:6px;background:var(--card);border:1px solid var(--edge);border-radius:30px}
.nav button{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:24px;color:var(--muted);font-size:10px;font-weight:700}
.nav button.on{color:var(--brand-text);background:var(--soft)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.hero{align-items:center;text-align:center;padding:24px 16px}
.fbox{width:72px;height:72px;border-radius:22px;background:var(--soft);border:1px solid var(--edge);color:var(--brand-text);display:flex;align-items:center;justify-content:center}
.fbox svg{width:30px;height:30px}
/* onboarding */
.ob-h{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 12px 4px}
.ob-h .bar{flex:1}.ob-f{display:flex;gap:10px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.ob-f .btn{flex:1}
.sub{border:1px solid var(--line);border-radius:var(--r-s);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
/* sheet + timer */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sh{width:100%;max-width:720px;max-height:92dvh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:in .25s ease-out}
#timer{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px;text-align:center}
#timer.on{display:flex}
.digits{font-size:clamp(56px,18vw,88px);font-weight:800;color:var(--brand-text);letter-spacing:-2px;font-variant-numeric:tabular-nums;margin:12px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ONBOARDING -->
<main id="onb" class="screen" aria-label="Setup">
  <div class="ob-h"><button class="ib plain" id="obBack" data-a="back" aria-label="Back"></button><div class="bar" id="obBar"><i style="width:0"></i></div><button class="ib plain" id="themeBtn2" data-a="theme"></button><button class="btn ghost" id="obSkip" data-a="skip" style="min-height:44px;padding:0 14px">Skip</button></div>
  <div class="scroll" id="obBody"></div>
  <div class="ob-f" id="obFoot"></div>
</main>

<!-- APP -->
<div id="app" class="screen" aria-label="O’ge">
  <div class="top"><div class="mark">O’<span>ge</span></div>
    <div style="display:flex;gap:8px"><button class="ib" id="themeBtn" data-a="theme"></button><button class="ib" data-a="settings" aria-label="Settings" id="setBtn"></button></div></div>
  <div class="scroll" id="view"></div>
  <nav class="nav" id="nav"></nav>
</div>

<div class="ov" id="ov" data-a="ovClose"><div class="sh" id="sh" role="dialog" aria-modal="true"></div></div>

<div id="timer" role="dialog" aria-label="Focus session">
  <div class="lbl">Focus session</div><h2 id="tTitle"></h2><div class="muted" id="tGoal"></div>
  <div class="digits" id="tDigits">25:00</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button class="btn pri" data-a="timerDone"></button><button class="btn ghost" data-a="timerEnd">End session</button></div>
</div>

<script>
/* ---------- icons ---------- */
const P={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',sl:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
wallet:'<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M16 13h2"/>',
bars:'<path d="M5 21v-6M12 21V3M19 21V9"/>',layers:'<path d="m12 2 10 5-10 5L2 7l10-5Z"/><path d="m2 12 10 5 10-5M2 17l10 5 10-5"/>',
play:'<path d="M6 4l14 8-14 8V4Z"/>',check:'<path d="m5 12 5 5 9-10"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="m15 18-6-6 6-6"/>',
more:'<path d="M5 12h.01M12 12h.01M19 12h.01"/>',focus:'<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

/* ---------- helpers & state ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const TODAY=()=>ymd(new Date());
const KEY='oge.v1';
const DEF=()=>({onb:{step:0,done:false},areas:[],customAreas:[],goals:[],learn:[],time:{mins:null,custom:'',days:[1,2,3,4,5],blocks:['morning']},money:{cur:'NGN',income:'',savings:'',reason:'',track:'both'},focus:'',secondary:[],tasks:[],income:[],reflect:{}});
let S=DEF();
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.onb)S=Object.assign(DEF(),r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let tab='focus',editing=false,rv='day',errMsg='';
const CUR={NGN:'₦',USD:'$',GBP:'£',EUR:'€',KES:'KSh ',GHS:'GH₵',ZAR:'R',INR:'₹'};
const money=n=>(CUR[S.money.cur]||'')+Math.round(n||0).toLocaleString();
const num=v=>{const n=parseFloat(v);return isFinite(n)&&n>=0?n:0};
const setP=(p,v)=>{const k=p.split('.');let o=S;k.slice(0,-1).forEach(x=>o=o[x]??(o[x]={}));o[k.at(-1)]=v};
const getP=p=>p.split('.').reduce((o,x)=>o?.[x],S);
const goalName=id=>S.goals.find(g=>g.id===id)?.name||'';
const fmtD=s=>parse(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const hm=m=>m>=60?`${Math.floor(m/60)}h${m%60?' '+m%60+'m':''}`:`${m}m`;

/* ---------- theme ---------- */
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('oge.theme',t)}catch(e){}
  document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0F1B17':'#F6F3EC';
  document.querySelectorAll('#themeBtn,#themeBtn2').forEach(b=>{b.innerHTML=ic(t==='dark'?'sun':'moon');b.setAttribute('aria-label',t==='dark'?'Switch to light mode':'Switch to dark mode');b.title=b.getAttribute('aria-label')})}
const theme=()=>document.documentElement.getAttribute('data-theme');

/* ---------- onboarding ---------- */
const AREAS=['Programming & Software Development','Mathematics & Statistics','Business & Entrepreneurship','Trading & Financial Skills','Art, Design & Creativity','Academic Studies','Fitness & Personal Development','A personal project','Something else'];
const FOCUS=['Learning a new skill','Making money','Building a project','Completing academic work','Improving personal discipline','Balancing several goals'];
const DAYS=[[1,'Mon'],[2,'Tue'],[3,'Wed'],[4,'Thu'],[5,'Fri'],[6,'Sat'],[0,'Sun']];
const BLK={morning:['Morning',9],afternoon:['Afternoon',14],evening:['Evening',18],night:['Late night',21]};
const chip=(k,v,on,a='tog',label)=>`<button type="button" class="chip${on?' on':''}" data-a="${a}" data-k="${k}" data-v="${esc(v)}" aria-pressed="${!!on}">${esc(label||v)}</button>`;
const inp=(lab,k,t='text',ph='')=>`<label class="f">${lab}<input class="fld" type="${t}" ${t==='number'?'min="0" inputmode="decimal"':''} data-k="${k}" value="${esc(getP(k))}" placeholder="${ph}"></label>`;
const rowIn=(l,id,f,lab,v,t='text',ph='')=>`<label class="f">${lab}<input class="fld" type="${t}" data-l="${l}" data-id="${id}" data-f="${f}" value="${esc(v)}" placeholder="${ph}"></label>`;
const rowSel=(l,id,f,lab,v,opts)=>`<label class="f">${lab}<select class="fld" data-l="${l}" data-id="${id}" data-f="${f}">${opts.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
const allAreas=()=>[...AREAS.slice(0,-1),...S.customAreas,AREAS.at(-1)];
const moneyFields=()=>`<div class="grid"><label class="f">Currency<select class="fld" data-k="money.cur">${Object.keys(CUR).map(c=>`<option value="${c}"${S.money.cur===c?' selected':''}>${c} (${CUR[c].trim()})</option>`).join('')}</select></label>${inp('Monthly income target','money.income','number','0')}</div>
<div class="grid">${inp('Savings target (optional)','money.savings','number')}${inp('Reason (optional)','money.reason','text','e.g. emergency fund')}</div>
<div class="lbl" style="margin-top:4px">Track</div><div class="chips">${[['weekly','Weekly income'],['monthly','Monthly progress'],['both','Both']].map(([v,l])=>chip('money.track',v,S.money.track===v,'set',l)).join('')}</div>
<p class="muted">Leave blank or enter 0 if you don’t have a target yet. O’ge never asks for bank details.</p>`;
const STEPS=[
 ()=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;min-height:60dvh"><div class="fbox">${ic('target')}</div><h1 style="font-size:36px">Make time for what matters.</h1><p class="muted" style="font-size:17px">Build your skills, make progress on your goals, and take control of your time and money.</p></div>`,
 ()=>`<div class="lbl">Step 1 of 7</div><h2>What do you want to spend your time developing?</h2><p class="muted">Pick as many as you like.</p>
  <div class="chips">${allAreas().map(a=>chip('areas',a,S.areas.includes(a))).join('')}</div>
  <div class="grid"><label class="f">Add your own<input class="fld" id="custA" placeholder="e.g. Music production" maxlength="60"></label><button class="btn" data-a="addArea" style="align-self:flex-end">${ic('plus')}Add</button></div>`,
 ()=>`<div class="lbl">Step 2 of 7</div><h2>What are you working toward?</h2><p class="muted">Add your main projects or goals — e.g. learn Python, ship a product, prepare for an exam. Optional.</p>
  ${S.goals.map((g,i)=>`<div class="sub"><div class="grid">${rowIn('goals',g.id,'name','Goal or project',g.name,'text','Name')}</div>${rowIn('goals',g.id,'what','What do you want to accomplish?',g.what)}
  <div class="grid">${rowIn('goals',g.id,'due','Deadline (optional)',g.due,'date')}${rowSel('goals',g.id,'pri','Priority',g.pri,['High','Medium','Low'])}</div><button class="btn bad" data-a="delGoalOb" data-id="${g.id}">Remove</button></div>`).join('')}
  <button class="btn" data-a="addGoalOb">${ic('plus')}Add a goal</button>`,
 ()=>{const ar=[...S.areas.filter(a=>a!=='Something else'),...(S.areas.includes('Something else')?['Something else']:[])];
  return `<div class="lbl">Step 3 of 7</div><h2>What do you want to learn?</h2><p class="muted">Optional — skip now and add details later in Develop.</p>`+
  (ar.length?ar.map(a=>`<div class="lbl" style="margin-top:6px">${esc(a)}</div>${S.learn.filter(l=>l.area===a).map(l=>`<div class="sub">${rowIn('learn',l.id,'topic','Skill or topic',l.topic)}<div class="grid">${rowSel('learn',l.id,'level','Current level',l.level,['Beginner','Intermediate','Advanced'])}${rowIn('learn',l.id,'due','Target date (optional)',l.due,'date')}</div>${rowIn('learn',l.id,'aim','What do you want to achieve?',l.aim)}<button class="btn bad" data-a="delLearnOb" data-id="${l.id}">Remove</button></div>`).join('')}<button class="btn" data-a="addLearnOb" data-v="${esc(a)}">${ic('plus')}Add a skill</button>`).join(''):`<div class="card muted">Pick development areas first (go back one step), or skip this.</div>`)},
 ()=>`<div class="lbl">Step 4 of 7</div><h2>How much time can you commit?</h2><p class="muted">These are planning preferences, not rigid commitments.</p>
  <div class="chips">${[[30,'30 min / day'],[60,'1 hour / day'],[120,'2 hours / day'],[180,'3+ hours / day'],['custom','Custom']].map(([v,l])=>chip('time.mins',v,S.time.mins===v,'set',l)).join('')}</div>
  ${S.time.mins==='custom'?inp('Minutes per day','time.custom','number','e.g. 90'):''}
  <div class="lbl">Days you want to work</div><div class="chips">${DAYS.map(([d,l])=>chip('time.days',d,S.time.days.includes(d),'togN',l)).join('')}</div>
  <div class="lbl">Preferred time blocks</div><div class="chips">${Object.entries(BLK).map(([k,[l]])=>chip('time.blocks',k,S.time.blocks.includes(k),'tog',l)).join('')}</div>`,
 ()=>`<div class="lbl">Step 5 of 7</div><h2>What do you want your money to look like?</h2><p class="muted">Optional. You can set a target of zero.</p>${moneyFields()}`,
 ()=>`<div class="lbl">Step 6 of 7</div><h2>What matters most right now?</h2><p class="muted">Choose one primary focus, then any secondary priorities.</p>
  <div class="chips">${FOCUS.map(f=>chip('focus',f,S.focus===f,'set')).join('')}</div>
  <div class="lbl" style="margin-top:6px">Secondary (optional)</div><div class="chips">${FOCUS.filter(f=>f!==S.focus).map(f=>chip('secondary',f,S.secondary.includes(f))).join('')}</div>`,
 ()=>{const t=planMins(),dn=DAYS.filter(([d])=>S.time.days.includes(d)).map(x=>x[1]).join(', ');
  const bl=S.time.blocks.map(b=>BLK[b][0]).join(', ');
  const box=(h,b)=>`<div class="card" style="gap:4px"><div class="lbl">${h}</div>${b}</div>`;
  return `<div class="lbl">Ready</div><h2>Create my plan</h2>
  ${box('Main focus',`<div class="tt">${esc(S.focus)}</div>${S.secondary.length?`<div class="tg">Also: ${esc(S.secondary.join(', '))}</div>`:''}`)}
  ${box('Goals',S.goals.length?S.goals.map(g=>`<div class="tt">${esc(g.name)} <span class="tg">· ${g.pri}${g.due?' · by '+esc(g.due):''}</span></div>`).join(''):'<div class="tg">None yet — add them later in Develop.</div>')}
  ${box('Learning areas',`<div class="tt">${esc(S.areas.join(', '))}</div>${S.learn.length?`<div class="tg">${S.learn.map(l=>esc(l.topic)).join(', ')}</div>`:''}`)}
  ${box('Available time',`<div class="tt">${hm(t)} per day</div><div class="tg">${dn||'No days chosen'} · ${bl||'Any time'}</div>`)}

function startPlan(){

    ...S.learn.map(l=>({title:'Practice '+l.topic,goalId:null}))];

  const hrs=(S.time.blocks.length?S.time.blocks:['morning']).map(b=>BLK[b][1]).sort((a,b)=>a-b);
  let d=new Date(),found=0,k=0;
  for(let i=0;i<8&&found<3;i++,d=addD(d,1)){if(!S.time.days.includes(d.getDay()))continue;found++;
    let t=hrs[0]*60;
    for(let j=0;j<n;j++,k++){const s=src[k%src.length];S.tasks.push({id:uid(),title:s.title,date:ymd(d),time:`${pad(Math.floor(t/60))}:${pad(t%60)}`,mins:per,goalId:s.goalId,status:'todo'});t+=per+15}}

 delGoal(e){if(!confirm('Delete this goal? Its tasks stay, but are no longer linked to it.'))return;S.tasks.forEach(t=>{if(t.goalId===e.dataset.id)t.goalId=null});S.goals=S.goals.filter(x=>x.id!==e.dataset.id);save();close();renderApp()},
 newLearn(){learnSheet()},editLearn(e){learnSheet(e.dataset.id)},
 saveLearn(e){const topic=fv('topic').trim();if(!topic)return shErr('Enter a skill or topic.');const d={area:fv('area'),topic,level:fv('level'),aim:fv('aim').trim(),due:fv('due')};
  if(e.dataset.id)Object.assign(S.learn.find(x=>x.id===e.dataset.id),d);else S.learn.push({id:uid(),...d});save();close();renderApp()},
 delLearn(e){S.learn=S.learn.filter(x=>x.id!==e.dataset.id);save();close();renderApp()},
 addIncome(){const a=parseFloat($('#iAmt').value),d=$('#iDate').value;if(!(a>0))return $('#iErr').textContent='Enter an amount greater than zero.';if(!d)return $('#iErr').textContent='Choose a date.';
  S.income.push({id:uid(),amt:a,date:d,note:$('#iNote').value.trim()});save();renderApp()},
 delIncome(e){S.income=S.income.filter(x=>x.id!==e.dataset.id);save();renderApp()},
 moneyTarget(){open('Money targets',moneyFields().replace('Track','Show on Money screen')+'<button class="btn pri full" data-a="moneyDone">Done</button>')},
 moneyDone(){const m=S.money;if([m.income,m.savings].some(v=>v!==''&&!(parseFloat(v)>=0)))return shErr('Targets must be zero or a positive number.');save();close();renderApp()},
 editPrefs(){close();editing=true;OB().step=1;route()},
 reset(){if(!confirm('This clears your goals, tasks, money entries and preferences from this device. Continue?'))return;try{localStorage.removeItem(KEY)}catch(x){}S=DEF();editing=false;tab='focus';close();route()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(!fn)return;
  if(el.dataset.a==='ovClose'&&!(e.target.id==='ov'||e.target.closest('.ib')))return;
  fn(el)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.k){setP(t.dataset.k,t.type==='number'?t.value:t.value)}
  else if(t.dataset.l){const it=S[t.dataset.l].find(x=>x.id===t.dataset.id);if(it)it[t.dataset.f]=t.value}else return;save();
  if(t.dataset.k==='money.cur'&&$('#ov').classList.contains('on')===false&&$('#app').classList.contains('on'))renderApp()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();endTimer()}});
/* ---------- boot ---------- */
applyTheme(theme());$('#setBtn').innerHTML=ic('sl');route();
